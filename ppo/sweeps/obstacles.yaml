name: obstacles
method: random
metric:
  name: score
  goal: maximize
run_cap: 200
# Score is logged at every in-loop evaluation (100k steps); brackets at 10 and 30
# evaluations = 1M and 3M steps.
early_terminate:
  type: hyperband
  min_iter: 10
parameters:
  ppo.alpha:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.002
  ppo.clip:
    distribution: uniform
    min: 0.1
    max: 0.3
  ppo.gae_lambda:
    distribution: uniform
    min: 0.9
    max: 0.99
  ppo.n_epochs:
    values: [6, 8, 10, 12, 14]
  ppo.target_kl:
    values: [0.02, 0.03, 0.05]
